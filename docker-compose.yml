services:
  listings-db:
    image: postgres:16
    environment:
      POSTGRES_DB: proptrack_listings
      POSTGRES_USER: proptrack
      POSTGRES_PASSWORD: proptrack
    ports:
      - "5432:5432"
    volumes:
      - listings-db-data:/var/lib/postgresql/data
      # Schema is now owned by EF Core migrations and data is seeded by the API on
      # startup (see DatabaseInitializer), so no Postgres init scripts are mounted.

  kafka:
    image: apache/kafka:3.8.0
    ports:
      # External listener for clients on the host (e.g. the API run via `dotnet run`).
      - "29092:29092"
    environment:
      # Single-node KRaft (no Zookeeper): this node is both broker and controller.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:29092
      # INTERNAL is reachable inside the compose network (kafka:9092); EXTERNAL from the host (localhost:29092).
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  listings-service:
    build:
      context: ./src
      dockerfile: ListingsService/ListingsService.Api/Dockerfile
    ports:
      - "5100:8080"
    environment:
      ConnectionStrings__ListingsDb: "Host=listings-db;Port=5432;Database=proptrack_listings;Username=proptrack;Password=proptrack"
      Kafka__BootstrapServers: "kafka:9092"
    depends_on:
      - listings-db
      - kafka

  auth-db:
    image: postgres:16
    environment:
      POSTGRES_DB: proptrack_auth
      POSTGRES_USER: proptrack
      POSTGRES_PASSWORD: proptrack
    ports:
      # 5432 is taken by listings-db; auth-db gets 5433 on the host.
      - "5433:5432"
    volumes:
      - auth-db-data:/var/lib/postgresql/data

  auth-service:
    build:
      context: ./src
      dockerfile: AuthService/AuthService.Api/Dockerfile
    ports:
      - "5300:8080"
    environment:
      ConnectionStrings__AuthDb: "Host=auth-db;Port=5432;Database=proptrack_auth;Username=proptrack;Password=proptrack"
      # RSA signing key injected as a file (architecture §6.2). In prod this comes
      # from a secrets manager; locally it's the gitignored dev key bind-mounted below.
      Jwt__PrivateKeyPath: "/run/secrets/jwt_private_key"
    volumes:
      - ./src/AuthService/keys/jwt_private_key.pem:/run/secrets/jwt_private_key:ro
    depends_on:
      - auth-db

  deals-db:
    image: postgres:16
    environment:
      POSTGRES_DB: proptrack_deals
      POSTGRES_USER: proptrack
      POSTGRES_PASSWORD: proptrack
    ports:
      # 5432 (listings-db) and 5433 (auth-db) are taken; deals-db gets 5434.
      - "5434:5432"
    volumes:
      - deals-db-data:/var/lib/postgresql/data

  deals-service:
    build:
      context: ./src
      dockerfile: DealsService/DealsService.Api/Dockerfile
    ports:
      - "5200:8080"
    environment:
      ConnectionStrings__DealsDb: "Host=deals-db;Port=5432;Database=proptrack_deals;Username=proptrack;Password=proptrack"
      Kafka__BootstrapServers: "kafka:9092"
      # Bearer tokens are validated against auth-service's JWKS (in-network URL).
      Jwt__JwksUrl: "http://auth-service:8080/auth/v1/.well-known/jwks.json"
    depends_on:
      - deals-db
      - kafka
      - auth-service

  documents-db:
    image: postgres:16
    environment:
      POSTGRES_DB: proptrack_documents
      POSTGRES_USER: proptrack
      POSTGRES_PASSWORD: proptrack
    ports:
      # 5432-5434 are taken (listings/auth/deals); documents-db gets 5435.
      - "5435:5432"
    volumes:
      - documents-db-data:/var/lib/postgresql/data

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000" # S3 API — presigned URLs from the browser hit this
      - "9001:9001" # web console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      # Browser PUTs to presigned URLs are cross-origin from the Vite dev server.
      MINIO_API_CORS_ALLOW_ORIGIN: "http://localhost:5173"
    volumes:
      - minio-data:/data

  documents-service:
    build:
      context: ./src
      dockerfile: DocumentsService/DocumentsService.Api/Dockerfile
    ports:
      - "5400:8080"
    environment:
      ConnectionStrings__DocumentsDb: "Host=documents-db;Port=5432;Database=proptrack_documents;Username=proptrack;Password=proptrack"
      Kafka__BootstrapServers: "kafka:9092"
      # Bearer tokens are validated against auth-service's JWKS (in-network URL).
      Jwt__JwksUrl: "http://auth-service:8080/auth/v1/.well-known/jwks.json"
      # Server-side S3 ops go in-network; presigned URLs must carry the
      # host-visible endpoint because the browser is what hits them.
      Storage__ServiceUrl: "http://minio:9000"
      Storage__PublicUrl: "http://localhost:9000"
    depends_on:
      - documents-db
      - kafka
      - minio
      - auth-service

  rag-db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: proptrack_rag
      POSTGRES_USER: proptrack
      POSTGRES_PASSWORD: proptrack
    ports:
      # 5432-5436 are taken/reserved; rag-db gets 5437.
      - "5437:5432"
    volumes:
      - rag-db-data:/var/lib/postgresql/data

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    command: ["--config", "/etc/litellm/config.yaml", "--port", "4000"]
    ports:
      - "4000:4000" # dev debugging; services reach it in-network
    environment:
      # Supplied via untracked .env next to this file (OPENAI_API_KEY=sk-...).
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - ./src/IngestionService/litellm/config.yaml:/etc/litellm/config.yaml:ro

  tei:
    # Optional zero-cost embeddings: docker compose --profile local-embeddings up -d tei
    # First start downloads the ~2.3GB BAAI/bge-m3 model into the cache volume.
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-latest
    command: --model-id BAAI/bge-m3
    profiles: ["local-embeddings"]
    volumes:
      - tei-cache:/data

  ingestion-service:
    build:
      context: ./src
      dockerfile: IngestionService/Dockerfile
    ports:
      # Dev-only mapping: this is an INTERNAL API (called by ai-service, forwarding
      # the end user's own bearer token — there is no service account) — not proxied
      # by the UI or exposed via the gateway.
      - "5500:8080"
    environment:
      DATABASE_URL: "postgresql://proptrack:proptrack@rag-db:5432/proptrack_rag"
      KAFKA_BOOTSTRAP: "kafka:9092"
      S3_ENDPOINT: "http://minio:9000"
      S3_ACCESS_KEY: "minioadmin"
      S3_SECRET_KEY: "minioadmin"
      S3_BUCKET: "proptrack-documents"
      LITELLM_BASE_URL: "http://litellm:4000"
      EMBEDDING_MODEL: "embed-openai" # switch to embed-local for the TEI path (then re-ingest)
      EMBEDDING_DIMENSIONS: "1024"
      JWKS_URL: "http://auth-service:8080/auth/v1/.well-known/jwks.json"
      # Docling runs its layout model through torch, and torch tries to JIT-compile
      # kernels via TorchInductor on first use. That needs a C++ compiler, and this
      # image has no g++ — so every PDF conversion dies with
      #   InvalidCxxCompiler: No working C++ compiler found ... (None, 'g++')
      # and the run is recorded as failed with zero chunks written.
      #
      # It stayed hidden because Inductor caches compiled kernels inside the
      # container's writable layer: once a container had warmed that cache the
      # failure stopped reproducing, and it came back the moment the container was
      # recreated. Ingesting the whole corpus after a `docker compose up -d` is
      # exactly the case that hits a cold cache.
      #
      # Disabling dynamo forces eager execution, which is the right trade here:
      # these are short documents parsed once, so compiled-kernel speed is worth
      # far less than the pipeline working from a cold start. The alternative is
      # adding g++ to the image, which is a much larger build for no real gain.
      TORCHDYNAMO_DISABLE: "1"
    depends_on:
      - rag-db
      - kafka
      - minio
      - litellm
      - auth-service

  search-service:
    # Owns the OpenSearch indices and (from Phase 3) the search API. Has no database of its
    # own — OpenSearch is its store, rebuilt by replaying the compacted property.snapshot and
    # deal.snapshot topics, so it never calls back into listings- or deals-service.
    build:
      context: ./src
      dockerfile: SearchService/SearchService.Api/Dockerfile
    ports:
      - "5600:8080"
    environment:
      OpenSearch__Url: "http://opensearch:9200"
      Kafka__BootstrapServers: "kafka:9092"
      # Properties only. Deals consume under their own group (search-service-deals) so either
      # index can be replayed from the start without rewinding the other.
      Kafka__ConsumerGroupId: "search-service"
      # Deals are authorized data, so the deals endpoints validate auth-service tokens.
      Jwt__JwksUrl: "http://auth-service:8080/auth/v1/.well-known/jwks.json"
    depends_on:
      - opensearch
      - kafka
      - auth-service

  ai-db:
    image: postgres:16
    environment:
      POSTGRES_DB: proptrack_ai
      POSTGRES_USER: proptrack
      POSTGRES_PASSWORD: proptrack
    ports:
      # 5432-5435 are taken (listings/auth/deals/documents) and 5437 is rag-db;
      # ai-db takes the gap at 5436.
      - "5436:5432"
    volumes:
      - ai-db-data:/var/lib/postgresql/data

  ai-service:
    # Claude-backed features (design doc §6.4). Phase 1 is Deal Q&A: retrieval from
    # ingestion-service, one Claude call, an answer with page citations.
    #
    # It holds no service account. Every call to ingestion-service forwards the
    # caller's own bearer token, so a question can never reach a document the user
    # couldn't already fetch — see IngestionSearchClient. The Kafka worker half
    # described in architecture §2.6 arrives with scoring in Phase 3.
    build:
      context: ./src
      dockerfile: AiService/AiService.Api/Dockerfile
    ports:
      # 5600 is search-service and 5601 is OpenSearch Dashboards; ai-service takes 5700.
      - "5700:8080"
    environment:
      ConnectionStrings__AiDb: "Host=ai-db;Port=5432;Database=proptrack_ai;Username=proptrack;Password=proptrack"
      # Bearer tokens are validated against auth-service's JWKS (in-network URL).
      Jwt__JwksUrl: "http://auth-service:8080/auth/v1/.well-known/jwks.json"
      Ingestion__BaseUrl: "http://ingestion-service:8080"
      # Used to resolve document ids to file names, so answers can attribute a
      # figure to the document it came from.
      Deals__BaseUrl: "http://deals-service:8080"
      # Supplied via the untracked .env next to this file (see .env.example).
      # Never bake the key into the image or commit it.
      Anthropic__ApiKey: ${ANTHROPIC_API_KEY:-}
      Anthropic__Model: "claude-sonnet-5"
    depends_on:
      - ai-db
      - auth-service
      - ingestion-service
      - deals-service

  opensearch:
    # Search engine backing search-service: the cross-entity index (properties today,
    # deals next). Postgres FTS can't span services, hence a separate store.
    image: opensearchproject/opensearch:2
    environment:
      discovery.type: single-node
      # Local dev only. From 2.12 OpenSearch refuses to start unless you either disable
      # the security plugin or set OPENSEARCH_INITIAL_ADMIN_PASSWORD. Disabling keeps the
      # cluster on plain http://opensearch:9200 with no TLS or admin user to manage.
      DISABLE_SECURITY_PLUGIN: "true"
      # Cap the JVM heap: this stack is large and Docker's VM is ~7.6 GiB. Without this
      # OpenSearch sizes the heap off total RAM and crowds out the other services.
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data

  opensearch-dashboards:
    # Web console for hand-writing queries (Dev Tools). Behind a profile so it doesn't
    # cost ~0.5-1 GiB on every `up`: docker compose --profile tools up -d opensearch-dashboards
    image: opensearchproject/opensearch-dashboards:2
    profiles: ["tools"]
    ports:
      - "5601:5601"
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
    depends_on:
      - opensearch

volumes:
  listings-db-data:
  auth-db-data:
  deals-db-data:
  documents-db-data:
  ai-db-data:
  minio-data:
  rag-db-data:
  tei-cache:
  opensearch-data:
