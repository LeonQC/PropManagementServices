# LiteLLM Proxy — the single embedding router (architecture v1.1 §3.5).
# The ingestion-service always calls the same OpenAI-compatible endpoint; which
# backing model serves it is decided HERE, so switching API <-> local is a
# config change plus a re-ingestion run, never a code change.

model_list:
  # Phase 1 (verified path): OpenAI, Matryoshka-truncated to 1024 dims by the
  # client's `dimensions` parameter.
  - model_name: embed-openai
    litellm_params:
      model: openai/text-embedding-3-small
      api_key: os.environ/OPENAI_API_KEY

  # Phase 2 (zero-cost path): HuggingFace TEI serving BAAI/bge-m3 (natively
  # 1024-dim) via its OpenAI-compatible /v1/embeddings. Start with:
  #   docker compose --profile local-embeddings up -d tei
  - model_name: embed-local
    litellm_params:
      model: openai/bge-m3
      api_base: http://tei:80/v1
      api_key: none

  # ── The RAGAS judge, for scripts/eval_ragas.py ───────────────────────────
  # This proxy is otherwise embeddings-only; the judge rides here so that
  # swapping judge models is a one-line config change rather than a code edit,
  # and so judge calls land in the same request log as everything else.
  #
  # OpenAI is chosen deliberately, because Deal Q&A *generates* on Anthropic:
  # AnthropicOptions.Model is claude-sonnet-5, called directly via the Anthropic
  # SDK. Judging a model's output with the same model — or the same family —
  # measures self-preference as much as it measures faithfulness, so the judge
  # has to come from the other provider. Swapping this to a Claude model would
  # quietly invalidate every faithfulness number the harness reports.
  - model_name: judge-default
    litellm_params:
      model: openai/gpt-4o
      api_key: os.environ/OPENAI_API_KEY

  # Cheaper judge candidate, same generation/family as judge-default (not a
  # jump to a newer model line with different claim-decomposition behavior).
  # Added alongside judge-default, not in place of it, so eval_ragas.py can
  # score the same cached answers under both via --judge-model and the two
  # can be diffed before deciding whether to switch the default over.
  - model_name: judge-mini
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY

  # ── Why the CROSS-ENCODER RERANKER is not routed here ────────────────────
  # It looks like it belongs: it is a model, and the rule above says models are
  # chosen in this file. app/rerank.py calls the tei-rerank container directly
  # anyway, for one concrete reason. TEI serves rerankers on `/rerank`, which
  # is not the OpenAI-shaped `/v1/rerank`; LiteLLM does have a TEI rerank
  # provider, but its request transform hard-codes `"truncate": false` and does
  # not expose the parameter. This corpus has chunks of 544 tokens against the
  # model's 512-token limit, so that path 422s and drops the whole batch —
  # intermittently, depending on which chunks a query happens to retrieve.
  # Measured, not assumed. Calling TEI directly is the same shape as
  # app/lexical.py calling OpenSearch directly.

litellm_settings:
  # TEI rejects OpenAI-only params like `dimensions`; drop instead of erroring
  # so the client can send one request shape to either route. This also covers
  # the judge route: RAGAS and LangChain both send temperature=0 by default, and
  # dropping it rather than erroring is what keeps the judge callable if it is
  # ever pointed at a model that rejects sampling parameters (claude-sonnet-5,
  # the generation model, already does — see AnthropicOptions.Temperature).
  drop_params: true
